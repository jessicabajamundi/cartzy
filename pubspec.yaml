name: cartzy
description: A Flutter e-commerce app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Used for PSGC API calls
  http: ^1.2.0

  cupertino_icons: ^1.0.6

  # Poppins font
  google_fonts: ^6.2.1

  # Barcode/QR scanning
  mobile_scanner: ^5.2.3
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/