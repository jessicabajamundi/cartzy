name: Build & Release Android APK

on:
  push:
    branches:
      - jessie-mobile
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read and auto-bump version
        id: version_step
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | cut -d '+' -f 1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | cut -d '+' -f 2)

          # Fetch remote tags to check if this tag was already released
          git fetch --tags origin || true

          # If tag v${RAW_VERSION} already exists, bump patch and build number
          if git rev-parse "v${RAW_VERSION}" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/v${RAW_VERSION}" | grep -q "v${RAW_VERSION}"; then
            echo "Tag v${RAW_VERSION} already exists. Auto-incrementing version..."
            MAJOR=$(echo "$RAW_VERSION" | cut -d '.' -f 1)
            MINOR=$(echo "$RAW_VERSION" | cut -d '.' -f 2)
            PATCH=$(echo "$RAW_VERSION" | cut -d '.' -f 3)
            NEW_PATCH=$((PATCH + 1))
            RAW_VERSION="${MAJOR}.${MINOR}.${NEW_PATCH}"
            BUILD_NUMBER=$((BUILD_NUMBER + 1))

            sed -i "s/^version: .*/version: ${RAW_VERSION}+${BUILD_NUMBER}/" pubspec.yaml
            echo "Bumped version to: ${RAW_VERSION}+${BUILD_NUMBER}"

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add pubspec.yaml
            git commit -m "chore(release): auto-bump version to v${RAW_VERSION}+${BUILD_NUMBER} [skip ci]" || true
            git push origin HEAD:${{ github.ref_name }} || true
          fi

          echo "tag=v${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building Cartzy v${RAW_VERSION}+${BUILD_NUMBER}..."

      - name: Build Release APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Release Artifacts
        run: |
          VERSION="${{ steps.version_step.outputs.version }}"
          cp build/app/outputs/flutter-apk/app-release.apk "cartzy-mobile-v${VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk cartzy.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Cartzy ${{ steps.version_step.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            cartzy-mobile-v${{ steps.version_step.outputs.version }}.apk
            cartzy.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

