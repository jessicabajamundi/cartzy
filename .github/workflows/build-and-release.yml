name: Build & Release Android APK

on:
  push:
    branches:
      - jessie-mobile
      - main
    paths:
      - 'lib/**'
      - 'android/**'
      - 'assets/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-and-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Read version from pubspec.yaml
        id: version_step
        run: |
          RAW_VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | cut -d '+' -f 1)
          BUILD_NUMBER=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | cut -d '+' -f 2)
          echo "tag=v${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "version=${RAW_VERSION}" >> $GITHUB_OUTPUT
          echo "build=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Building Cartzy v${RAW_VERSION}+${BUILD_NUMBER}..."

      - name: Build Release APK
        run: flutter build apk --release

      - name: Prepare Release Artifacts
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk cartzy.apk
          cp build/app/outputs/flutter-apk/app-release.apk app-release.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_step.outputs.tag }}
          name: Cartzy ${{ steps.version_step.outputs.tag }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          files: |
            cartzy.apk
            app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

